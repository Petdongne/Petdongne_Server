server:
  port: ${SERVER_PORT:8080}

app:
  elasticsearch:
    hostAndPort: ${ELASTICSEARCH_HOST_AND_PORT:localhost:9200}
    connectionTimeout: ${ELASTICSEARCH_CONNECTION_TIME_OUT:5}
    socketTimeout: ${ELASTICSEARCH_SOCKET_TIME_OUT:20}
  crawling:
    address:
      post-list-base-url: https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardList.do?bbsId=BBSMSTR_000000000052
      user-agent: Mozilla/5.0
      post-base-url: https://www.mois.go.kr/frt/bbs/type001/commonSelectBoardArticle.do
      output-file-save-path: ${ADDRESS_CRAWLING_DATA_FILE_PATH}
  notification:
    discord-webhook-url: ${DISCORD_WEBHOOK_URL}


feature:
  validation:
    elasticsearch:
      enabled: false

spring:
  application:
    name: petdongne_server

  profiles:
    active: dev

  datasource:
    service:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petDongne}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    batch:
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${BATCH_DB_NAME:petDongneBatch}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    open-in-view: false
    hibernate:
      ddl-auto: update
      jdbc:
        time_zone: Asia/Seoul

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 1000
        validator:
          apply_to_ddl: true
        hbm2ddl:
          schema_filter_provider: org.songeun.petdongne_server.global.config.HibernateCustomSchemaFilterProvider
  data:
    redis:
      host: localhost
      port: 6379
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 스웨거 설정
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

# 로깅 설정
logging:
  level:
#    com.zaxxer.hikari: DEBUG
    org:
      springframework:
        jdbc:
          core: debug
        orm: debug
#        transaction: trace
#        transaction.interceptor: TRACE
#        transaction.support: TRACE
#        jdbc: trace
#        jdbc.datasource: trace
#        jdbc.datasource.DataSourceTransactionManager: trace
#        batch: trace
      hibernate:
        SQL: debug
        orm.jdbc.bind: trace
      elasticsearch.client: trace
    root: info
#      springframework.data.elasticsearch.core: DEBUG


---
spring:
  config:
    activate:
      on-profile: dev

